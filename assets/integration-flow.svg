<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020913"/><stop offset="1" stop-color="#061725"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="460" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="#173b51"/><text x="42" y="44" fill="#58eaff" font-family="ui-monospace,Consolas,monospace" font-size="15" letter-spacing="3">LEVIATHAN INTEGRATIONS // TRUST BOUNDARY FLOW</text><text x="42" y="68" fill="#7d9fb2" font-family="Segoe UI,Arial" font-size="12">Every external connection passes through an explicit adapter, permission boundary and documented public contract.</text><path id="p" d="M90 225 H1110" fill="none" stroke="#174c66" stroke-width="4" stroke-linecap="round"/><circle r="6" fill="#63f2ff" filter="url(#g)"><animateMotion dur="7.5s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><g font-family="Segoe UI,Arial" text-anchor="middle"><g><rect x="50" y="150" width="210" height="150" rx="16" fill="#061722" stroke="#20bfdd"/><text x="155" y="186" fill="#eefcff" font-size="17" font-weight="750">EXTERNAL SYSTEM</text><text x="155" y="216" fill="#8aa7b7" font-size="10">Minecraft • Discord • webhook</text><text x="155" y="237" fill="#688a9d" font-size="10">third-party service or plugin</text></g><g><rect x="320" y="150" width="210" height="150" rx="16" fill="#061722" stroke="#8174ff"/><text x="425" y="186" fill="#eefcff" font-size="17" font-weight="750">ADAPTER</text><text x="425" y="216" fill="#8aa7b7" font-size="10">plugin • client • webhook handler</text><text x="425" y="237" fill="#688a9d" font-size="10">version and lifecycle handling</text></g><g><rect x="590" y="135" width="220" height="180" rx="18" fill="#061a28" stroke="#36e4f7" stroke-width="2.5" filter="url(#g)"/><text x="700" y="177" fill="#eefcff" font-size="18" font-weight="800">TRUST BOUNDARY</text><text x="700" y="208" fill="#62dce9" font-size="10">authentication • permission</text><text x="700" y="230" fill="#62dce9" font-size="10">validation • rate limits</text><text x="700" y="252" fill="#688a9d" font-size="10">safe configuration and logging</text></g><g><rect x="870" y="150" width="260" height="150" rx="16" fill="#061722" stroke="#43d9a3"/><text x="1000" y="186" fill="#eefcff" font-size="17" font-weight="750">PUBLIC LEVIATHAN CONTRACT</text><text x="1000" y="216" fill="#8aa7b7" font-size="10">API • event • documented result</text><text x="1000" y="237" fill="#688a9d" font-size="10">private internals stay outside scope</text></g></g><text x="600" y="370" text-anchor="middle" fill="#65889b" font-family="ui-monospace,Consolas,monospace" font-size="10">NO BOT TOKENS • NO WEBHOOK SECRETS • NO PRIVATE HOSTS • EXPLICIT AUTHENTICATION AND PERMISSIONS</text><rect x="4" y="4" width="1192" height="452" rx="22" fill="none" stroke="#0b3346" stroke-width="1.5"/><rect x="4" y="4" width="1192" height="452" rx="22" fill="none" stroke="#32efff" stroke-width="3" stroke-dasharray="390 1540" filter="url(#g)" opacity=".9"><animate attributeName="stroke-dashoffset" values="0;-1930" dur="9s" repeatCount="indefinite"/></rect></svg>