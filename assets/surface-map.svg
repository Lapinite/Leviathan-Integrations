<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><defs><linearGradient id="b"><stop stop-color="#020914"/><stop offset="1" stop-color="#061827"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="390" rx="24" fill="url(#b)"/><rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#17394d"/><text x="50" y="48" fill="#4deaff" font-family="ui-monospace,Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">LEVIATHAN INTEGRATIONS // PUBLIC SURFACE MAP</text><text x="50" y="77" fill="#809eae" font-family="Segoe UI,Arial,sans-serif" font-size="15">Supported adapters connect public Leviathan contracts to external platforms without exposing private infrastructure.</text><g font-family="Segoe UI,Arial,sans-serif"><g transform="translate(55 125)"><rect width="250" height="145" rx="18" fill="#061a28" stroke="#1b5369"/><text x="125" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">MINECRAFT</text><text x="125" y="77" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">SERVER BRIDGES</text><text x="125" y="106" text-anchor="middle" fill="#789cad" font-size="11">plugins • events • compatibility</text></g><g transform="translate(340 125)"><rect width="250" height="145" rx="18" fill="#061a28" stroke="#1b5369"/><text x="125" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">COMMUNITY</text><text x="125" y="77" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">MESSAGING</text><text x="125" y="106" text-anchor="middle" fill="#789cad" font-size="11">Discord • notifications • moderation</text></g><g transform="translate(625 125)"><rect width="250" height="145" rx="18" fill="#061a28" stroke="#1b5369"/><text x="125" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">PLATFORM</text><text x="125" y="77" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">WEBHOOKS + APIs</text><text x="125" y="106" text-anchor="middle" fill="#789cad" font-size="11">events • lifecycle • permissions</text></g><g transform="translate(910 125)"><rect width="235" height="145" rx="18" fill="#061a28" stroke="#1b5369"/><text x="117" y="39" text-anchor="middle" fill="#53edff" font-family="ui-monospace,Consolas,monospace" font-size="11">COMMERCE</text><text x="117" y="77" text-anchor="middle" fill="#f2fbff" font-size="18" font-weight="700">VERIFIED EVENTS</text><text x="117" y="106" text-anchor="middle" fill="#789cad" font-size="11">orders • rewards • entitlements</text></g></g><path id="p" d="M305 197H340M590 197H625M875 197H910" stroke="#28677f" stroke-width="3"/><circle r="5" fill="#76f5ff" filter="url(#g)"><animateMotion dur="4.3s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle><text x="55" y="318" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">BOUNDARIES // AUTHENTICATION • PERMISSIONS • RATE LIMITS • VERSIONING • SAFE LOGGING</text><text x="55" y="345" fill="#6d94a8" font-family="ui-monospace,Consolas,monospace" font-size="10">SECRETS // THIRD-PARTY CREDENTIALS AND PRIVATE LEVIATHAN INFRASTRUCTURE ARE NEVER PART OF THE PUBLIC CONTRACT</text></svg>